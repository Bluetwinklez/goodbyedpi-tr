permissions:
  contents: read
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pester
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 4.10.1
          $r = Invoke-Pester ./tests -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          Import-Module PSScriptAnalyzer -RequiredVersion 1.23.0
          $s = @(
            Invoke-ScriptAnalyzer -Path ./gdpi-tr.ps1 -Settings ./.PSScriptAnalyzerSettings.psd1
            Invoke-ScriptAnalyzer -Path ./scripts/package-release.ps1 -Settings ./.PSScriptAnalyzerSettings.psd1
            Invoke-ScriptAnalyzer -Path ./scripts/vm-verify.ps1 -Settings ./.PSScriptAnalyzerSettings.psd1
          ) | Where-Object { $_ }
          $s | Format-Table -AutoSize
          if ($s) { exit 1 }
      - name: Verify script version constant format
        shell: powershell
        run: |
          $m = Select-String -Path ./gdpi-tr.ps1 -Pattern '^\$Script:Surum\s*=\s*''([0-9]+\.[0-9]+\.[0-9]+)'''
          if (-not $m) { throw 'gdpi-tr.ps1 içinde geçerli $Script:Surum sabiti bulunamadı.' }
      - name: Test release ZIP contents and SHA-256 manifest
        shell: powershell
        run: |
          & ./scripts/package-release.ps1 -Version v0.0.0 -OutputDirectory $env:RUNNER_TEMP | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'GoodbyeDPI-TR-v0.0.0.zip'
          $sum = "$zip.sha256"
          if (!(Test-Path $zip) -or !(Test-Path $sum)) { throw 'Release asset missing' }
          $expected = ((Get-Content $sum -Raw).Trim() -split ' ')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Release ZIP checksum mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'gdpi-package-smoke'
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          foreach ($file in @('GoodbyeDPI-TR.cmd', 'gdpi-tr.ps1', 'README.md', 'README.tr.md', 'SECURITY.md', 'LICENSE', 'listeler/turkiye.txt')) {
            if (!(Test-Path (Join-Path $extract "GoodbyeDPI-TR-v0.0.0/$file"))) { throw "Missing ZIP entry: $file" }
          }

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sürüm etiketi tutarlılığını doğrula
        shell: powershell
        run: |
          $m = Select-String -Path ./gdpi-tr.ps1 -Pattern '^\$Script:Surum\s*=\s*''([^'']+)'''
          if (-not $m) { throw 'gdpi-tr.ps1 içinde $Script:Surum bulunamadı.' }
          $betikSurumu = $m.Matches[0].Groups[1].Value
          $etiketSurumu = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($betikSurumu -ne $etiketSurumu) {
            throw "Sürüm uyuşmazlığı: etiket '$env:GITHUB_REF_NAME' ama gdpi-tr.ps1 `$Script:Surum = '$betikSurumu'"
          }
      - name: Paketle ve yayınla
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./scripts/package-release.ps1 -Version $env:GITHUB_REF_NAME -OutputDirectory '.' | Out-Null
          $ad = "GoodbyeDPI-TR-$env:GITHUB_REF_NAME"
          gh release create $env:GITHUB_REF_NAME "$ad.zip" "$ad.zip.sha256" --title "GoodbyeDPI-TR $env:GITHUB_REF_NAME" --generate-notes
