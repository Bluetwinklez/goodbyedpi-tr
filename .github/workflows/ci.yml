name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 4.10.1
          $r = Invoke-Pester ./tests -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $s = Invoke-ScriptAnalyzer -Path ./gdpi-tr.ps1 -Severity Error
          $s | Format-Table -AutoSize
          if ($s) { exit 1 }

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Paketle ve yayınla
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ad = "GoodbyeDPI-TR-$env:GITHUB_REF_NAME"
          New-Item -ItemType Directory $ad | Out-Null
          Copy-Item GoodbyeDPI-TR.cmd, gdpi-tr.ps1, README.md, LICENSE $ad
          Copy-Item listeler $ad -Recurse
          Compress-Archive $ad "$ad.zip"
          gh release create $env:GITHUB_REF_NAME "$ad.zip" --title "GoodbyeDPI-TR $env:GITHUB_REF_NAME" --generate-notes
